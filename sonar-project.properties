# SonarQube project configuration for the iem-cast monorepo.
#
# projectKey/projectName are supplied by the workflow from repository
# variables (see .github/workflows/sonarqube.yml and docs/CI.md). Set the
# matching project on the SonarQube server before enabling the gate.
sonar.projectKey=iem-cast
sonar.projectName=iem-cast

# Rust workspace (`crates`, `apps/desktop/src-tauri`) plus the TS/React frontend
# (`apps/web`). The Rust analyzer is supported by SonarQube (see
# docs/CI.md), so no fictional language support is assumed.
sonar.sources=apps,crates

# Vendored, generated, build, and test content.
# Leading `/` anchors top-level paths so a bare `dist/**` cannot silently
# exclude a nested source directory named `dist`.
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/target/**,\
  **/coverage/**,\
  **/test-results/**,\
  **/playwright-report/**,\
  **/.git/**,\
  **/.env*,\
  **/*.test.*,\
  **/*.spec.*,\
  **/*.d.ts,\
  **/__tests__/**,\
  /apps/desktop/src-tauri/gen/**,\
  /apps/desktop/src-tauri/icons/**,\
  /apps/web/e2e/**,\
  /apps/web/site/**,\
  /docs/**,\
  /.github/**,\
  /local-certs/**

# No coverage report is configured: the repository's current scripts and
# lockfiles include no coverage tooling (the web suite has no vitest coverage
# provider; no Rust coverage tool is pinned), and coverage report paths must
# not be invented. See docs/CI.md for how to add coverage later.
#
# When coverage is wired up, point the matching property at a report that the
# workflow actually generates, e.g.:
#   sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info
#   sonar.rust.lcov.reportPaths=lcov.info
