name: SonarQube

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Analysis only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: sonarqube-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Produces the Rust LCOV the scanner imports. Runs on macOS for the same
  # reason as the `rust` job in tests.yml: the workspace includes the Tauri
  # desktop crate (`apps/desktop/src-tauri`), whose native dependencies are
  # macOS frameworks and cannot be built faithfully on Linux.
  rust-coverage:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install web dependencies (locked)
        run: npm ci

      # Required before the workspace coverage run: the desktop crate embeds the
      # built musician bundle (`apps/desktop/src-tauri/src/asset_embed.rs` uses
      # `#[folder = "../../web/dist/musician"]`) and a desktop test asserts the
      # join page is present. `apps/web/dist` is gitignored, so it is always
      # absent on a fresh runner. Same requirement as tests.yml.
      - name: Build web bundles for desktop embed
        run: npm run build:web

      # Pinned to the dtolnay/rust-toolchain v1 commit, matching tests.yml.
      # Toolchain 1.90 matches rust-toolchain.toml (`channel = "1.90"`);
      # `llvm-tools-preview` is the rustup component cargo-llvm-cov needs.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: "1.90"
          components: llvm-tools-preview

      # Pinned to the Swatinem/rust-cache v2 commit, matching tests.yml.
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Shorthand ref installs cargo-llvm-cov via the action's pinned manifest.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Prepare coverage output directory
        run: mkdir -p rust-coverage

      - name: Rust coverage (workspace, locked, lcov)
        run: cargo llvm-cov --workspace --locked --lcov --output-path rust-coverage/lcov.info

      # `if-no-files-found: error` fails the job if the report is missing, so
      # the scanner never silently scans without coverage.
      - name: Upload Rust lcov
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage-lcov
          path: rust-coverage/lcov.info
          if-no-files-found: error

  sonarqube:
    needs: rust-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # fetch-depth 0 is required so SonarQube can read full SCM history/blame
      # for new-code detection.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      # Fork PRs do not receive repository secrets, and an unconfigured repo has
      # none either. Detect that up front and skip with a clear annotation
      # instead of failing on missing credentials. See docs/CI.md for setup.
      - name: Check SonarQube credentials
        id: sonar_creds
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -n "$SONAR_TOKEN" ] && [ -n "$SONAR_HOST_URL" ]; then
            echo "run_scan=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_scan=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SONAR_TOKEN and/or SONAR_HOST_URL are not set (fork PR or unconfigured repository); skipping the SonarQube scan. See docs/CI.md."
          fi

      # `sonar.projectKey`/`sonar.projectName` are the scanner's project identity,
      # not attacker input, but they still must be safe before use. Resolve the
      # repository variable (falling back to the repository name) and validate
      # the characters here, then pass the validated values to the scan action.
      - name: Resolve and validate SonarQube project key/name
        id: sonar_meta
        env:
          RAW_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || github.event.repository.name }}
          RAW_PROJECT_NAME: ${{ vars.SONAR_PROJECT_NAME || github.event.repository.name }}
        run: |
          set -euo pipefail
          # Sonar project keys allow letters, digits, '.', '_', ':', '-'.
          if [ -z "$RAW_PROJECT_KEY" ] || ! printf '%s' "$RAW_PROJECT_KEY" | grep -Eq '^[A-Za-z0-9_.:-]+$'; then
            echo "::error::Invalid SonarQube project key (empty or disallowed characters)."
            exit 1
          fi
          # Display names also allow spaces and common punctuation.
          if [ -z "$RAW_PROJECT_NAME" ] || ! printf '%s' "$RAW_PROJECT_NAME" | grep -Eq '^[A-Za-z0-9_.:()&+/ -]+$'; then
            echo "::error::Invalid SonarQube project name (empty or disallowed characters)."
            exit 1
          fi
          echo "key=$RAW_PROJECT_KEY" >> "$GITHUB_OUTPUT"
          echo "name=$RAW_PROJECT_NAME" >> "$GITHUB_OUTPUT"

      # Coverage is produced here, before the scan, so the lcov files exist.
      # sonar-project.properties points at apps/web/coverage/lcov.info and
      # rust-coverage/lcov.info. Generation is gated on the credential check so
      # a skipped scan (fork PR / unconfigured repo) does no wasted work.
      - name: Setup Node.js
        if: steps.sonar_creds.outputs.run_scan == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (locked)
        if: steps.sonar_creds.outputs.run_scan == 'true'
        run: npm ci

      # Vitest v8 coverage with a repo-relative lcov reporter (the reporter's
      # projectRoot override lives in apps/web/vitest.config.ts).
      - name: Web coverage (lcov)
        if: steps.sonar_creds.outputs.run_scan == 'true'
        run: npm run test:coverage --workspace apps/web

      - name: Download Rust lcov
        if: steps.sonar_creds.outputs.run_scan == 'true'
        uses: actions/download-artifact@v4
        with:
          name: rust-coverage-lcov
          path: rust-coverage

      # Pull-request parameters (sonar.pullrequest.*) and branch detection are
      # left to the scanner's supported auto-detection. Do NOT pass
      # `-Dsonar.branch.name` on a pull_request event: it conflicts with the
      # auto-detected PR parameters. No branch name (which can be attacker-influenced
      # on PRs) is interpolated into the scan arguments.
      - name: SonarQube Scan
        if: steps.sonar_creds.outputs.run_scan == 'true'
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        with:
          args: >
            -Dsonar.projectKey=${{ steps.sonar_meta.outputs.key }}
            -Dsonar.projectName=${{ steps.sonar_meta.outputs.name }}
            -Dsonar.qualitygate.wait=true
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
