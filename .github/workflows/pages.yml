name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/src/site/**'
      - 'apps/web/src/ui/**'
      - 'apps/web/src/styles/**'
      - 'apps/web/site/**'
      - 'apps/web/vite.site.config.ts'
      - 'apps/web/package.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The custom domain and asset base are deployment settings, not source constants. CNAME is
      # emitted into the artifact from VITE_SITE_DOMAIN; the site serves from the domain root, so
      # the base path is '/'.
      - run: npm run build:site --workspace apps/web
        env:
          VITE_SITE_BASE: '/'
          VITE_SITE_DOMAIN: ${{ vars.PAGES_CUSTOM_DOMAIN }}
          VITE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
