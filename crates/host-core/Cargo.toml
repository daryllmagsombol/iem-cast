[package]
name = "host-core"
version = "0.1.0"
edition = "2021"
description = "IEM Cast host core: capture, DSP, control, media boundaries"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.27.0", features = ["v4", "serde"] }
thiserror = "2.0"
cpal = "0.18.2"
rtrb = "0.4.0"
opus = "0.4.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
axum = { version = "0.8.9", features = ["ws"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
str0m = { version = "0.24.1", default-features = false, features = ["aws-lc-rs"] }
if-addrs = "0.14.0"
getrandom = "0.4.3"

[dev-dependencies]
rcgen = "0.14.10"
